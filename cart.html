<!DOCTYPE html>
<html lang="en" data-page="cart">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart — Voltcore</title>
<link rel="stylesheet" href="assets/css/store.css">

<!-- =====================================================================
     LOAD ORDER MATTERS. Do not reorder these.

     1. store.js    state, routing and the event plan. Builds SPX_BOOT,
                    which everything below reads.
     2. pixel.js    debug bus, validator and the five network interceptors.
                    MUST load before scevent.min.js, or the first PAGE_VIEW
                    beacon leaves before anything is watching it.
     3. gtm.js      installs the GTM container when mode is gtm or both.
                    High in <head> because that is where the real snippet
                    goes, and tag timing depends on it.
     4. guides.js   per-event placement rules, shared by console + codegen.
     5. codegen.js  turns what fired into copy-paste implementation code.
     6. usercode.js runs YOUR editor code. Loaded here so a beforeFire hook
                    is registered before the page fires anything.
     ================================================================== -->
<script src="assets/js/store.js"></script>
<script src="assets/js/pixel.js"></script>
<script src="assets/js/gtm.js"></script>
<script src="assets/js/guides.js"></script>
<script src="assets/js/codegen.js"></script>
<script src="assets/js/usercode.js"></script>
</head>
<body>

<main class="wrap">

  <!-- ===================================================================
       CART PAGE — fires PAGE_VIEW, plus ADD_CART when you arrive from an
       add-to-cart action.

       ADD_CART  required: item_ids, price, currency
                 optional: item_category, brands, number_items, description

       Fire ADD_CART in the SUCCESS callback of your cart request, not in the
       click handler. If you fire on click, out-of-stock failures and network
       errors are counted as adds.

       Decide whether `price` is the unit price or the line total for the
       quantity added, and stay consistent across your whole site. Mixing
       the two makes cart value untrustworthy and is very hard to spot later.

       Note the URL you land on has no ?action= in it. The action is applied
       and then the browser is redirected to a clean URL, so a refresh cannot
       silently replay the add. Arriving with ?added= still lets a refresh
       re-fire ADD_CART on purpose, so you can reproduce that advertiser bug.
       ================================================================ -->

  <h1 class="ph">Your cart</h1>
  <p class="sub">Checkout is instrumented step by step: START_CHECKOUT, then ADD_BILLING, then PURCHASE.</p>
  <div id="spx-cart"></div>
</main>

<footer class="shop-foot">
  <div class="foot-in">
    <span class="logo">VOLT<span>CORE</span></span>
    <p>A fake storefront for testing Snap Pixel implementations. No products are real and no orders are placed.</p>
    <p class="foot-links">
      <a href="https://businesshelp.snapchat.com/s/article/pixel-website-install" target="_blank" rel="noopener">Snap Pixel documentation</a>
    </p>
  </div>
</footer>

<!-- console.js and terms.js only define markup + behaviour; shell.js mounts
     them and releases the event plan once the terms gate is acknowledged.
     The page module runs last, so the DOM it needs already exists. -->
<script src="assets/js/console.js"></script>
<script src="assets/js/terms.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/page-cart.js"></script>
</body>
</html>
